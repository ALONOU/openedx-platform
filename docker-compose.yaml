# Open edX - Docker Compose pour Coolify (v4)
# Config LMS/CMS dans l'image (Dockerfile.openedx). Plus de montages ./config → évite l'erreur Coolify.
# Variables : à définir dans Coolify (Application → Environment).

version: '3.8'

services:
  mysql:
    image: mysql:8.4.0
    container_name: openedx-mysql
    restart: unless-stopped
    environment:
      MYSQL_ROOT_PASSWORD: ${MYSQL_ROOT_PASSWORD}
      MYSQL_DATABASE: ${MYSQL_DATABASE}
      MYSQL_USER: ${MYSQL_USER}
      MYSQL_PASSWORD: ${MYSQL_PASSWORD}
    volumes:
      - mysql_data:/var/lib/mysql
      - ./config/mysql/my.cnf:/etc/mysql/conf.d/custom.cnf:ro
    networks:
      - openedx
    healthcheck:
      test: ["CMD", "mysqladmin", "ping", "-h", "localhost", "-u", "root", "-p${MYSQL_ROOT_PASSWORD}"]
      interval: 10s
      timeout: 5s
      retries: 5
      start_period: 30s

  mongodb:
    image: mongo:7.0.28
    container_name: openedx-mongodb
    restart: unless-stopped
    environment:
      MONGO_INITDB_ROOT_USERNAME: ${MONGO_USER}
      MONGO_INITDB_ROOT_PASSWORD: ${MONGO_PASSWORD}
      MONGO_INITDB_DATABASE: ${MONGO_DATABASE}
    volumes:
      - mongo_data:/data/db
    networks:
      - openedx
    healthcheck:
      test: ["CMD", "mongosh", "--eval", "db.adminCommand('ping')"]
      interval: 10s
      timeout: 5s
      retries: 5
      start_period: 30s

  redis:
    image: redis:7.4.5
    container_name: openedx-redis
    restart: unless-stopped
    command: redis-server --appendonly yes
    volumes:
      - redis_data:/data
    networks:
      - openedx
    healthcheck:
      test: ["CMD", "redis-cli", "ping"]
      interval: 10s
      timeout: 5s
      retries: 5

  meilisearch:
    image: getmeili/meilisearch:v1.8.4
    container_name: openedx-meilisearch
    restart: unless-stopped
    environment:
      MEILI_MASTER_KEY: ${MEILI_MASTER_KEY}
      MEILI_ENV: production
    volumes:
      - meilisearch_data:/meili_data
    networks:
      - openedx
    healthcheck:
      test: ["CMD", "curl", "-f", "http://localhost:7700/health"]
      interval: 10s
      timeout: 5s
      retries: 5

  lms:
    build:
      context: .
      dockerfile: Dockerfile.openedx
    image: openedx-custom:latest
    container_name: openedx-lms
    restart: unless-stopped
    environment:
      SERVICE_VARIANT: lms
      DJANGO_SETTINGS_MODULE: lms.envs.production
      RUN_MIGRATIONS: "1"
    volumes:
      - openedx_media:/openedx/media
      - openedx_data:/openedx/data
      - openedx_static:/openedx/staticfiles
    networks:
      - openedx
    expose:
      - "8000"
    depends_on:
      mysql:
        condition: service_healthy
      mongodb:
        condition: service_healthy
      redis:
        condition: service_healthy
      meilisearch:
        condition: service_healthy
    # Production: utiliser uWSGI (static-map configuré dans config/lms/uwsgi.ini)
    command: uwsgi --ini /openedx/config/lms/uwsgi.ini

  cms:
    image: openedx-custom:latest
    container_name: openedx-cms
    restart: unless-stopped
    environment:
      SERVICE_VARIANT: cms
      DJANGO_SETTINGS_MODULE: cms.envs.production
      RUN_MIGRATIONS: "0"
    volumes:
      - openedx_media:/openedx/media
      - openedx_data:/openedx/data
      - openedx_static:/openedx/staticfiles
    networks:
      - openedx
    expose:
      - "8000"
    depends_on:
      mysql:
        condition: service_healthy
      mongodb:
        condition: service_healthy
      redis:
        condition: service_healthy
      meilisearch:
        condition: service_healthy
    # Production: utiliser uWSGI (static-map configuré dans config/cms/uwsgi.ini)
    command: uwsgi --ini /openedx/config/cms/uwsgi.ini

  lms-worker:
    image: openedx-custom:latest
    container_name: openedx-lms-worker
    restart: unless-stopped
    environment:
      SERVICE_VARIANT: lms
      DJANGO_SETTINGS_MODULE: lms.envs.production
      C_FORCE_ROOT: "1"
      RUN_MIGRATIONS: "0"
    volumes:
      - openedx_media:/openedx/media
      - openedx_data:/openedx/data
    networks:
      - openedx
    depends_on:
      - lms
      - redis
    command: celery --app=lms.celery worker --loglevel=info --max-tasks-per-child=100

  cms-worker:
    image: openedx-custom:latest
    container_name: openedx-cms-worker
    restart: unless-stopped
    environment:
      SERVICE_VARIANT: cms
      DJANGO_SETTINGS_MODULE: cms.envs.production
      C_FORCE_ROOT: "1"
      RUN_MIGRATIONS: "0"
    volumes:
      - openedx_media:/openedx/media
      - openedx_data:/openedx/data
    networks:
      - openedx
    depends_on:
      - cms
      - redis
    command: celery --app=cms.celery worker --loglevel=info --max-tasks-per-child=100

volumes:
  mysql_data:
    name: openedx_mysql_data
  mongo_data:
    name: openedx_mongo_data
  redis_data:
    name: openedx_redis_data
  meilisearch_data:
    name: openedx_meilisearch_data
  openedx_media:
    name: openedx_media
  openedx_data:
    name: openedx_data
  openedx_static:
    name: openedx_static

networks:
  openedx:
    name: openedx
    driver: bridge
